{% extends 'base.html' %}

{% block title %}Logged Out — NovaPOS{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">
    <!-- Logout Confirmation Card -->
    <div class="bg-white rounded-2xl shadow-card border border-slate-100 overflow-hidden text-center">
      <!-- Success Icon -->
      <div class="pt-8 pb-4">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-emerald-100 mx-auto mb-4">
          <i class="fas fa-sign-out-alt text-3xl text-emerald-600"></i>
        </div>
        <h1 class="text-2xl font-bold text-primary">You've been logged out</h1>
        <p class="text-slate-500 text-sm mt-2 px-6">
          Your session has been securely ended.
        </p>
      </div>
      
      <!-- Action Buttons -->
      <div class="p-6 pt-2 border-t border-slate-100 bg-slate-50/50">
        <div class="flex flex-col sm:flex-row gap-3">
          <a href="{% url 'login' %}" class="btn-primary justify-center flex-1">
            <i class="fas fa-sign-in-alt mr-2"></i> Login Again
          </a>
          <a href="{% url 'product_list' %}" class="btn-outline justify-center flex-1">
            <i class="fas fa-store mr-2"></i> Continue Shopping
          </a>
        </div>
      </div>
    </div>
    
    <!-- Additional Info -->
    <div class="mt-6 text-center">
      <div class="inline-flex items-center gap-2 text-xs text-slate-400 bg-white px-4 py-2 rounded-full shadow-soft">
        <i class="fas fa-shield-alt text-accent"></i>
        <span>Your data is safe and secure</span>
      </div>
    </div>
    
    <!-- Redirect Info -->
    <p class="text-center text-xs text-slate-400 mt-6">
      <i class="fas fa-clock mr-1"></i>
      You will be redirected to the home page in <span id="countdown" class="font-semibold text-accent">5</span> seconds
    </p>
  </div>
</div>

<script>
  // Optional: Auto-redirect after 5 seconds
  let seconds = 5;
  const countdownElement = document.getElementById('countdown');
  
  const interval = setInterval(function() {
    seconds--;
    if (countdownElement) {
      countdownElement.textContent = seconds;
    }
    if (seconds <= 0) {
      clearInterval(interval);
      window.location.href = "{% url 'product_list' %}";
    }
  }, 1000);
</script>
{% endblock %}
